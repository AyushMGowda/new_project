<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#222222">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#262626">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Mess Pass</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#111;font-family:Montserrat,Arial,sans-serif;color:#000;overflow:hidden}
body{min-height:100dvh}
button,input{font:inherit}
.app{width:100%;max-width:430px;height:100dvh;min-height:100dvh;margin:0 auto;background:#fff;overflow:hidden}
.screen,.coupon,.pass{width:100%;height:100dvh;min-height:100dvh;overflow:hidden;background:#fff}
.hidden{display:none!important}
.header{height:52px;min-height:52px;background:#262626;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;font-size:19px;font-weight:700;z-index:10;padding-top:env(safe-area-inset-top)}
.header .x{position:absolute;right:16px;color:#aaa;font-size:31px;font-weight:300;line-height:1;cursor:pointer}
.header .back{position:absolute;left:16px;color:#fff;font-size:30px;font-weight:300;line-height:1;cursor:pointer}

/* Profile setup */
.form-wrap{height:calc(100dvh - 52px);overflow:auto;padding:16px;background:#fff;-webkit-overflow-scrolling:touch}
.notice{background:#eaf8ef;border:1px solid #a9dfbd;color:#126b3b;border-radius:9px;padding:11px 13px;margin-bottom:14px;font-size:13px;line-height:1.35}
.photo-preview{width:170px;height:170px;margin:0 auto 16px;border-radius:14px;overflow:hidden;background:#eee;border:1px solid #bbb}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.field{margin:0 0 13px}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field input,.field select{width:100%;height:50px;border:1px solid #aaa;border-radius:7px;background:#fff;color:#000!important;font-size:16px;padding:0 13px;outline:none}
.field input::file-selector-button{background:#666;color:#fff;border:0;padding:9px 11px;margin-right:9px;border-radius:4px}
.video-preview{width:100%;max-height:230px;background:#111;border-radius:8px;overflow:hidden;margin-top:8px}.video-preview video{display:block;width:100%;max-height:230px}
.save{width:100%;height:56px;border:0;border-radius:7px;background:#198f5b;color:#fff;font-size:17px;font-weight:800;margin-top:4px;cursor:pointer}.small{font-size:12px;color:#777;margin-top:6px;line-height:1.4}

/* Coupon: one-screen layout, stretched like the reference */
.coupon{
    background:#e7e7e7;
    height:calc(100dvh - 52px);
    min-height:0;
    overflow:hidden;
    padding:10px 0 0;
}
.coupon-shell{
    background:#fff;
    height:100%;
    margin:0 16px;
    border:1px solid #d7d7d7;
    border-top:0;
    box-shadow:0 2px 5px rgba(0,0,0,.22);
    overflow:hidden;
    padding:0 0 20px;
}
.coupon-card{
    flex:0 0 auto;
    margin:0;
    background:linear-gradient(105deg,#ff8075,#ffd477);
    border-radius:9px;
    padding:14px 20px 24px;
    box-shadow:0 4px 9px #999;
}
.coupon-photo{
    width:min(29vw,120px);
    height:min(29vw,120px);
    border-radius:15px;
    overflow:hidden;
    margin:0 auto 7px;
    background:#ddd
}
.coupon-photo img{width:100%;height:100%;object-fit:cover}
.nameid{
    text-align:center;
    font-size:17px;
    line-height:1.2;
    margin-bottom:17px
}
.detail{
    font-size:13px;
    line-height:1.25;
    margin:0 0 13px
}
.detail strong{
    display:block;
    margin-bottom:2px;
    font-size:13px
}
.detail:last-child{margin-bottom:0}

.instruction{
    text-align:center;
    font-size:clamp(17px,5vw,23px);
    line-height:1.2;
    padding:34px 20px 14px
}
.rate{
    text-align:center;
    margin:0 auto 28px;
    border:2px solid #7c1d2c;
    color:#111;
    background:#fff;
    border-radius:8px;
    padding:4px 14px;
    font-size:14px;
    font-weight:700;
    width:max-content
}
.meal-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px 14px;
    padding:0 18px;
    margin:0 auto;
    max-width:360px
}
.meal{
    height:54px;
    border:0;
    border-radius:9px;
    background:linear-gradient(105deg,#ff8075,#ffd477);
    box-shadow:0 5px 8px #888;
    font-size:16px;
    color:#000;
    font-weight:500;
    cursor:pointer
}
.meal span{margin-left:7px}
.meal:nth-child(3){grid-column:1/2}

/* Mess pass: intentionally scrollable, matching the larger original pass layout */
.pass{background:#e7e7e7;min-height:100dvh;height:100dvh;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:18px}
.pass-card{background:#fff;margin:0 15px;border-radius:0 0 15px 15px;overflow:hidden;min-height:0;height:auto}
.pass-top{padding:68px 15px 18px;position:relative}.badge{position:absolute;right:12px;top:10px;width:31px;height:31px;border-radius:50%;background:#b3b3b3;display:flex;align-items:center;justify-content:center;font-weight:800}
.pass-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;text-align:center}.frame{border:1px solid #000;padding:12px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.5)}.frame img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pass-text{font-weight:800;font-size:15px;margin-top:8px;line-height:1.4;text-shadow:1px 2px 4px rgba(0,0,0,.35)}.pass-sub{font-weight:700;font-size:14px;margin-top:2px;line-height:1.4}.qr-frame{padding:10px}.qr-frame img{background:#fff}
.info{text-align:center;font-size:14px;line-height:1.6;padding:22px 15px 8px}.date-row{display:flex;justify-content:space-between;padding:5px 35px;font-size:18px;font-weight:800;margin:15px 0 18px}.approved{font-family:Arial,sans-serif;text-align:center;color:#62c354;font-size:28px;font-weight:800;margin:18px 0 14px;text-shadow:0 0 10px rgba(98,195,84,.4)}
.rate-pass{text-align:center}.rate-pass .rate{margin-bottom:25px}.video-strip{background:var(--accent,#062506);padding:25px}.video-box{background:#fff;width:100%;aspect-ratio:1;overflow:hidden;display:flex;align-items:center;justify-content:center}.video-box video{width:100%;height:100%;object-fit:contain;background:#fff}.video-empty{color:#999;font-size:14px;text-align:center;padding:30px}
.footer{padding:25px;background:#fff}.gray{color:#9a9a9a;font-size:14px;font-weight:600;margin-top:22px}.value{color:#000;font-size:15px;font-weight:600;margin-top:6px;line-height:1.4}

/* Camera scanner */
.scanner{width:100%;height:100dvh;background:#202020;min-height:100dvh;color:#fff;position:relative;overflow:hidden}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#202020}
.camera-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 25%,transparent 72%,rgba(0,0,0,.42));pointer-events:none}
.scan-frame{position:absolute;left:12%;right:12%;top:28%;height:44%;border:2px solid rgba(255,255,255,.75);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.18);pointer-events:none}
.scan-line{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#d21f45;box-shadow:0 0 12px #ff3d67;animation:lineBlink .72s steps(1,end) infinite;pointer-events:none}
.dot{position:absolute;width:7px;height:7px;background:#ffd21a;border-radius:50%;opacity:0;pointer-events:none;transition:left .12s ease-out,top .12s ease-out,opacity .08s linear;box-shadow:0 0 7px rgba(255,210,26,.7)}
.d1{left:25%;top:42%}.d2{left:58%;top:38%}.d3{left:72%;top:54%}.d4{left:38%;top:63%}.d5{left:64%;top:67%}
.scanner-title{position:absolute;top:calc(16px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:18px;font-weight:800;text-shadow:0 2px 6px #000;z-index:3}.scanner-status{position:absolute;bottom:32px;left:18px;right:18px;text-align:center;font-size:13px;font-weight:700;text-shadow:0 2px 5px #000;z-index:3}.camera-denied{position:absolute;left:20px;right:20px;top:45%;text-align:center;font-weight:700;font-size:15px;z-index:4;display:none}
@keyframes lineBlink{0%,38%{opacity:1}39%,100%{opacity:0}}

@media(max-width:360px){
    .coupon-shell{margin-left:10px;margin-right:10px}
    .coupon-card{padding-left:14px;padding-right:14px}
    .coupon-photo{width:120px;height:120px}
    .detail{font-size:12px;margin-bottom:11px}
    .detail strong{font-size:12px}
    .meal-grid{padding-left:14px;padding-right:14px;gap:14px 10px}
    .meal{height:54px;font-size:16px}
    .instruction{font-size:16px;padding-top:28px}
    .rate{font-size:13px;margin-bottom:24px}
}

/* Feedback modal */
.feedback-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.48);
    z-index:100;
    display:none;
    align-items:flex-end;
}
.feedback-backdrop.open{display:flex}
.feedback-modal{
    width:100%;
    max-width:430px;
    height:100dvh;
    margin:0 auto;
    background:#fff;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}
.feedback-header{
    height:52px;
    min-height:52px;
    background:#303030;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:19px;
    font-weight:500;
    box-shadow:0 2px 6px rgba(0,0,0,.35);
}
.feedback-header .feedback-close{
    position:absolute;
    right:16px;
    top:7px;
    color:#fff;
    font-size:34px;
    line-height:1;
    font-weight:300;
    cursor:pointer;
}
.feedback-grabber{
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);
    width:56px;
    height:5px;
    border-radius:8px;
    background:#ddd;
}
.feedback-scroll{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:20px 0 36px;
}
.feedback-intro{
    text-align:center;
    padding:0 20px;
}
.feedback-title{
    margin:0;
    font-size:25px;
    line-height:1.15;
    font-weight:700;
}
.feedback-subtitle{
    margin:20px 0 24px;
    font-size:20px;
    line-height:1.2;
}
.feedback-stars{
    display:flex;
    justify-content:center;
    gap:16px;
    margin:0 auto 28px;
}
.feedback-star{
    border:0;
    background:transparent;
    padding:0;
    width:42px;
    height:48px;
    font-size:43px;
    line-height:1;
    color:#f2b600;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}
.feedback-star:focus{outline:none}
.feedback-star.empty{color:#f2b600}
.feedback-form{display:none;padding:0 20px}
.feedback-form.show{display:block}
.feedback-label{
    font-size:18px;
    margin:4px 0 20px;
}
.feedback-section{
    margin:0 0 28px;
}
.feedback-section-title{
    text-align:center;
    text-decoration:underline;
    font-size:18px;
    margin:0 0 18px;
}
.feedback-options{
    background:#fff;
    border:1px solid #f0f0f0;
}
.feedback-option{
    min-height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:0 16px;
    border-bottom:1px solid #ddd;
    font-size:17px;
}
.feedback-option:last-child{border-bottom:0}
.feedback-option input{
    appearance:none;
    -webkit-appearance:none;
    width:20px;
    height:20px;
    border:2px solid #888;
    border-radius:2px;
    background:#fff;
    flex:0 0 auto;
    position:relative;
}
.feedback-option input:checked{
    background:#ff7a22;
    border-color:#ff7a22;
}
.feedback-option input:checked::after{
    content:'✓';
    position:absolute;
    color:#fff;
    font-size:15px;
    font-weight:800;
    left:2px;
    top:-1px;
}
.feedback-meals{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}
.feedback-meal{
    min-width:0;
    height:50px;
    border:2px solid #999;
    border-radius:16px;
    background:#fff;
    font-size:16px;
    cursor:pointer;
}
.feedback-meal.selected{
    border-color:#ff7a22;
    box-shadow:0 0 0 2px rgba(255,122,34,.12);
}
.feedback-remarks{
    width:100%;
    min-height:76px;
    resize:none;
    border:1px solid #bbb;
    border-radius:3px;
    padding:10px;
    font-size:16px;
    outline:none;
}
.feedback-submit{
    display:block;
    width:285px;
    max-width:90%;
    height:58px;
    margin:24px auto 0;
    border:0;
    border-radius:8px;
    background:linear-gradient(105deg,#ff8075,#ffd477);
    box-shadow:0 5px 8px #888;
    font-size:21px;
    color:#111;
    cursor:pointer;
}
.feedback-message{
    position:fixed;
    inset:0;
    z-index:120;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.28);
}
.feedback-message.show{display:flex}
.feedback-message-box{
    width:300px;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 35px rgba(0,0,0,.35);
    text-align:center;
}
.feedback-message-box h3{
    margin:20px 12px 8px;
    font-size:18px;
}
.feedback-message-box p{
    margin:0 18px 20px;
    font-size:14px;
    line-height:1.45;
}
.feedback-message-box button{
    width:100%;
    height:48px;
    border:0;
    border-top:1px solid #ddd;
    background:#fff;
    color:#ff7a22;
    font-size:18px;
    cursor:pointer;
}
@media(max-width:360px){
    .feedback-stars{gap:10px}
    .feedback-star{width:38px;font-size:39px}
    .feedback-title{font-size:23px}
    .feedback-subtitle{font-size:18px}
    .feedback-meals{gap:8px}
    .feedback-meal{font-size:14px}
}

</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const KEY='messPassProfileV10';
let profile=null, selectedMeal='Lunch', activeStream=null, passTimer=null, passReturnTimer=null;
const app=document.getElementById('app');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function getProfile(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function saveProfile(p){localStorage.setItem(KEY,JSON.stringify(p));profile=p}
async function enterFullscreen(){
  try{if(!document.fullscreenElement && document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen({navigationUI:'hide'})}}catch(e){}
  try{if(screen.orientation?.lock) await screen.orientation.lock('portrait')}catch(e){}
}
function exitFullscreen(){try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}
function showForm(){
 app.innerHTML=`<div class="screen"><div class="header">Fill Profile</div><div class="form-wrap">
 <div class="notice">✓ Fill this once. Your profile is saved on this device and reused next time.</div>
 <div class="photo-preview"><img id="photoPreview" src="${profile?.photo||''}" onerror="this.style.display='none'"></div>
 <div class="field"><label>Profile Photo</label><input id="photo" type="file" accept="image/*"></div>
 ${field('name','Full Name',profile?.name||'Ayush M')}${field('id','ID Number',profile?.id||'12434322')}${field('mess','Mess Assigned',profile?.mess||'Mess BH-4')}${field('program','Program',profile?.program||'P132:B.Tech. (Computer Science and Engineering)(2022)')}${field('father',"Father's Name",profile?.father||'Mahesh KC (9483746197)')}${field('mother',"Mother's Name",profile?.mother||'Reetha')}${field('hostel','Hostel',profile?.hostel||'Boys Hostel-04-B511-Bed C Mess')}
 <div class="field"><label>Accepted Badge Video</label><input id="video" type="file" accept="video/mp4,video/webm,video/*"><div class="small">Upload the exact video you want displayed in the green section of the final Mess Pass.</div><div id="videoPreviewWrap"></div></div>
 <div class="field"><label>Pass Accent Color</label><input id="accent" type="color" value="${profile?.accent||'#062506'}"></div>
 <button class="save" id="save">💾 SAVE PROFILE</button></div></div>`;
 const photo=document.getElementById('photo'); photo.addEventListener('change',e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>{document.getElementById('photoPreview').src=r.result;document.getElementById('photoPreview').style.display='block'};r.readAsDataURL(f)}});
 if(profile?.video)renderVideoPreview(profile.video);
 document.getElementById('video').addEventListener('change',e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>renderVideoPreview(r.result);r.readAsDataURL(f)}});
 document.getElementById('save').onclick=()=>{const p={name:v('name'),id:v('id'),mess:v('mess'),program:v('program'),father:v('father'),mother:v('mother'),hostel:v('hostel'),accent:document.getElementById('accent').value,photo:document.getElementById('photoPreview').src,video:document.getElementById('video').files[0]?null:(profile?.video||null)};const file=document.getElementById('video').files[0];if(file){const r=new FileReader();r.onload=()=>{p.video=r.result;saveProfile(p);showCoupon()};r.readAsDataURL(file)}else{saveProfile(p);showCoupon()}};
}
function renderVideoPreview(src){document.getElementById('videoPreviewWrap').innerHTML=`<div class="video-preview"><video src="${src}" controls muted></video></div>`}
function field(id,label,val){return `<div class="field"><label>${label}</label><input id="${id}" type="text" value="${esc(val)}"></div>`}
function v(id){return document.getElementById(id).value}

function closeFeedback(){
    const modal=document.getElementById('feedbackModal');
    if(modal)modal.classList.remove('open');
    const msg=document.getElementById('feedbackMessage');
    if(msg)msg.classList.remove('show');
}
function openFeedback(){
    const modal=document.getElementById('feedbackModal');
    if(!modal)return;
    modal.classList.add('open');
    document.getElementById('feedbackForm').classList.remove('show');
    document.getElementById('feedbackScroll').scrollTop=0;
    document.querySelectorAll('.feedback-star').forEach(star=>{
        star.textContent='☆';
        star.classList.add('empty');
    });
}
function selectFeedbackRating(rating){
    document.querySelectorAll('.feedback-star').forEach(star=>{
        const n=Number(star.dataset.rating);
        star.textContent=n<=rating?'★':'☆';
        star.classList.toggle('empty',n>rating);
    });
    const form=document.getElementById('feedbackForm');
    form.classList.add('show');
    setTimeout(()=>{
        document.getElementById('feedbackScroll').scrollTo({
            top:document.querySelector('.feedback-form').offsetTop-8,
            behavior:'smooth'
        });
    },30);
}
function submitFeedback(){
    const msg=document.getElementById('feedbackMessage');
    if(msg)msg.classList.add('show');
}
function showCoupon(){
 if(passTimer){clearInterval(passTimer);passTimer=null}
 if(passReturnTimer){clearTimeout(passReturnTimer);passReturnTimer=null}
 profile=getProfile();if(!profile){showForm();return}
 app.innerHTML=`<div class="coupon"><div class="header"><span class="back" onclick="showCoupon()">‹</span>Mess Coupon<span class="x">×</span></div><div class="coupon-shell">
 <div class="coupon-card" id="profilePhotoAccess"><div class="coupon-photo"><img src="${profile.photo}" alt="Profile"></div><div class="nameid">${esc(profile.name)} ${esc(profile.id)}</div><div class="detail"><strong>Father's Name</strong>${esc(profile.father)}</div><div class="detail"><strong>Mother's Name</strong>${esc(profile.mother)}</div><div class="detail"><strong>Program Name</strong>${esc(profile.program)}</div><div class="detail"><strong>Hostel</strong>${esc(profile.hostel)}</div></div>
 <div class="instruction">Tap on the meal name to scan<br>and avail food.</div><button class="rate" id="rateUsBtn" type="button">⭐ RATE US</button>
 <div class="meal-grid"><button class="meal" data-meal="Breakfast">Breakfast <span>→</span></button><button class="meal" data-meal="Lunch">Lunch <span>→</span></button><button class="meal" data-meal="Dinner">Dinner <span>→</span></button></div>
 <div class="feedback-backdrop" id="feedbackModal">
   <div class="feedback-modal">
     <div class="feedback-header"><div class="feedback-grabber"></div>Feedback<button class="feedback-close" id="feedbackClose" type="button">×</button></div>
     <div class="feedback-scroll" id="feedbackScroll">
       <div class="feedback-intro">
         <h2 class="feedback-title">Mess Feedback</h2>
         <div class="feedback-subtitle">Tell us how we did!</div>
         <div class="feedback-stars" id="feedbackStars">
           <button class="feedback-star" data-rating="1" type="button">☆</button>
           <button class="feedback-star" data-rating="2" type="button">☆</button>
           <button class="feedback-star" data-rating="3" type="button">☆</button>
           <button class="feedback-star" data-rating="4" type="button">☆</button>
           <button class="feedback-star" data-rating="5" type="button">☆</button>
         </div>
       </div>
       <div class="feedback-form" id="feedbackForm">
         <div class="feedback-label">Tap to select meal type</div>
         <div class="feedback-section">
           <div class="feedback-meals" id="feedbackMeals">
             <button class="feedback-meal" data-meal="Breakfast" type="button">Breakfast</button>
             <button class="feedback-meal" data-meal="Lunch" type="button">Lunch</button>
             <button class="feedback-meal" data-meal="Tea" type="button">Tea</button>
             <button class="feedback-meal" data-meal="Dinner" type="button">Dinner</button>
           </div>
         </div>
         <div class="feedback-section">
           <h3 class="feedback-section-title">Service/Staff</h3>
           <div class="feedback-options">
             <label class="feedback-option"><span>Food served late</span><input type="checkbox"></label>
             <label class="feedback-option"><span>Staff not polite</span><input type="checkbox"></label>
           </div>

async function showScanner(){
 if(activeStream){activeStream.getTracks().forEach(t=>t.stop());activeStream=null}
 app.innerHTML=`<div class="scanner"><video id="camera" autoplay muted playsinline></video><div class="camera-shade"></div><div class="scan-frame"></div><div class="scan-line"></div><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="dot d4"></span><span class="dot d5"></span><div class="scanner-title">Scanning ${esc(selectedMeal)}</div><div class="scanner-status" id="scannerStatus">Camera access requested…</div><div class="camera-denied" id="cameraDenied">Camera access was blocked. Allow camera permission and try again.</div></div>`;
 const video=document.getElementById('camera');
 const dots=[...document.querySelectorAll('.dot')];
 let dotTimer=null;
 const randomizeDots=()=>{
   dots.forEach((dot,i)=>{
     const left=16+Math.random()*68;
     const top=32+Math.random()*40;
     dot.style.left=left+'%';
     dot.style.top=top+'%';
     dot.style.opacity=(Math.random()>.22)?'1':'0';
   });
 };
 randomizeDots();
 dotTimer=setInterval(randomizeDots,280);
 try{
   activeStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
   video.srcObject=activeStream;
   document.getElementById('scannerStatus').textContent='Scanning…';
 }catch(err){
   document.getElementById('scannerStatus').textContent='Camera unavailable';
   document.getElementById('cameraDenied').style.display='block';
 }
 setTimeout(()=>{if(dotTimer)clearInterval(dotTimer);showPass()},4500);
}
function stopCamera(){if(activeStream){activeStream.getTracks().forEach(t=>t.stop());activeStream=null}}
function makeQR(){const data=encodeURIComponent(`${profile.id}-${profile.name} - MESS PASS VERIFICATION SYSTEM ACCREDITED`);return `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${data}&ecc=H&margin=10`}
function showPass(){stopCamera();if(passTimer){clearInterval(passTimer);passTimer=null}if(passReturnTimer){clearTimeout(passReturnTimer);passReturnTimer=null}profile=getProfile();const now=new Date();const date=now.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'});const time=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});app.innerHTML=`<div class="pass"><div class="header"><span class="back" onclick="showCoupon()">‹</span>Mess Pass<span class="x">×</span></div><div class="pass-card"><div class="pass-top"><div class="badge" id="passCountdown">30</div><div class="pass-grid"><div><div class="frame"><img src="${profile.photo}"></div><div class="pass-text">${esc(profile.id)}</div><div class="pass-sub">${esc(profile.name)}</div></div><div><div class="frame qr-frame"><img src="${makeQR()}" alt="QR"></div><div class="pass-text">${selectedMeal}</div><div class="pass-sub">${esc(profile.mess)}</div></div></div></div><div class="info"><div style="margin-bottom:5px">${esc(profile.program)}</div><div style="font-weight:700">Your Assigned Mess - ${esc(profile.mess)}</div></div><div class="date-row"><span>${date}</span><span>${time}</span></div><div class="approved">Meal Approved</div><div class="rate-pass"><div class="rate">⭐ RATE US</div></div><div class="video-strip" style="--accent:${profile.accent}"><div class="video-box">${profile.video?`<video src="${profile.video}" autoplay loop muted playsinline></video>`:`<div class="video-empty">No accepted badge video uploaded.<br>Double-click the profile photo on the coupon page to add one.</div>`}</div></div><div class="footer"><div><div class="gray">Father's Name</div><div class="value">${esc(profile.father)}</div></div><div><div class="gray">Mother's Name</div><div class="value">${esc(profile.mother)}</div></div><div><div class="gray">Program</div><div class="value">${esc(profile.program)}</div></div><div><div class="gray">Hostel</div><div class="value">${esc(profile.hostel)}</div></div></div></div></div>`;
 let remaining=30;
 passTimer=setInterval(()=>{remaining--;const badge=document.getElementById('passCountdown');if(!badge){clearInterval(passTimer);passTimer=null;return}badge.textContent=remaining;if(remaining<=0){clearInterval(passTimer);passTimer=null;passReturnTimer=setTimeout(showCoupon,500)}},1000)}
profile=getProfile();if(profile)showCoupon();else showForm();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
window.addEventListener('pagehide',stopCamera);
