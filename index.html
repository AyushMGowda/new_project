<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#262626">
<link rel="manifest" href="manifest.json">
<title>Mess Pass</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#111;font-family:Montserrat,Arial,sans-serif;color:#000}body{min-height:100vh}.app{width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:#e8e8e8;overflow:hidden}.screen{min-height:100vh;background:#fff}.hidden{display:none!important}
.header{height:62px;background:#262626;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;font-size:20px;font-weight:700;z-index:5}.header .x{position:absolute;right:18px;color:#999;font-size:34px;font-weight:300;line-height:1}.header .back{position:absolute;left:18px;color:#fff;font-size:32px;font-weight:300}
.form-wrap{padding:18px;background:#fff}.notice{background:#eaf8ef;border:1px solid #a9dfbd;color:#126b3b;border-radius:9px;padding:12px 14px;margin-bottom:16px;font-size:14px;line-height:1.4}.photo-preview{width:188px;height:188px;margin:0 auto 18px;border-radius:14px;overflow:hidden;background:#eee;border:1px solid #bbb}.photo-preview img{width:100%;height:100%;object-fit:cover}.field{margin:0 0 15px}.field label{display:block;font-weight:700;font-size:15px;margin-bottom:7px}.field input,.field select{width:100%;height:54px;border:1px solid #aaa;border-radius:7px;background:#fff;color:#000!important;font-size:16px;padding:0 14px;outline:none}.field input::file-selector-button{background:#666;color:#fff;border:0;padding:10px 12px;margin-right:10px;border-radius:4px}.video-preview{width:100%;max-height:260px;background:#111;border-radius:8px;overflow:hidden;margin-top:8px}.video-preview video{display:block;width:100%;max-height:260px}.save{width:100%;height:58px;border:0;border-radius:7px;background:#198f5b;color:#fff;font-size:18px;font-weight:800;margin-top:5px;cursor:pointer}.small{font-size:12px;color:#777;margin-top:6px;line-height:1.4}
.coupon{background:#fff;min-height:100vh}.coupon-card{margin:16px 28px 0;background:linear-gradient(105deg,#ff8075,#ffd477);border-radius:9px;padding:32px 36px 30px;box-shadow:0 4px 9px #999}.coupon-photo{width:216px;height:216px;border-radius:18px;overflow:hidden;margin:0 auto 12px;background:#ddd}.coupon-photo img{width:100%;height:100%;object-fit:cover}.nameid{text-align:center;font-size:25px;line-height:1.25;margin-bottom:36px}.detail{font-size:18px;line-height:1.35;margin:0 0 24px}.detail strong{display:block;margin-bottom:3px}.instruction{text-align:center;font-size:29px;line-height:1.25;padding:55px 28px 22px}.rate{text-align:center;margin:0 auto 28px;border:3px solid #7c1d2c;color:#111;background:#fff;border-radius:9px;padding:5px 18px;font-size:17px;font-weight:700;width:max-content}.meal-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;padding:0 36px 90px}.meal{height:122px;border:0;border-radius:9px;background:linear-gradient(105deg,#ff8075,#ffd477);box-shadow:0 7px 10px #888;font-size:25px;color:#000;font-weight:500;cursor:pointer}.meal span{margin-left:7px}.meal:nth-child(3){grid-column:1/2}
.pass{background:#e7e7e7;min-height:100vh}.pass-card{background:#fff;margin:0 15px;border-radius:0 0 15px 15px;overflow:hidden}.pass-top{padding:68px 15px 18px;position:relative}.badge{position:absolute;right:12px;top:10px;width:31px;height:31px;border-radius:50%;background:#b3b3b3;display:flex;align-items:center;justify-content:center;font-weight:800}.pass-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;text-align:center}.frame{border:1px solid #000;padding:12px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.5)}.frame img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.pass-text{font-weight:800;font-size:15px;margin-top:8px;line-height:1.4;text-shadow:1px 2px 4px rgba(0,0,0,.35)}.pass-sub{font-weight:700;font-size:14px;margin-top:2px;line-height:1.4}.qr-frame{padding:10px}.qr-frame img{background:#fff}.info{text-align:center;font-size:14px;line-height:1.6;padding:22px 15px 8px}.date-row{display:flex;justify-content:space-between;padding:5px 35px;font-size:18px;font-weight:800;margin:15px 0 18px}.approved{font-family:Arial,sans-serif;text-align:center;color:#62c354;font-size:28px;font-weight:800;margin:18px 0 14px;text-shadow:0 0 10px rgba(98,195,84,.4)}.rate-pass{text-align:center}.rate-pass .rate{margin-bottom:25px}
.video-strip{background:var(--accent,#062506);padding:25px}.video-box{background:#fff;width:100%;aspect-ratio:1;overflow:hidden;display:flex;align-items:center;justify-content:center}.video-box video{width:100%;height:100%;object-fit:contain;background:#fff}.video-empty{color:#999;font-size:14px;text-align:center;padding:30px}.footer{padding:25px;background:#fff}.gray{color:#9a9a9a;font-size:14px;font-weight:600;margin-top:22px}.value{color:#000;font-size:15px;font-weight:600;margin-top:6px;line-height:1.4}
.scanner{background:#000;min-height:100vh;color:#fff;position:relative;overflow:hidden}.scanner-camera{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#151515,#000 65%)}.scan-line{position:absolute;left:14%;right:14%;top:50%;height:2px;background:#7d1b2c;box-shadow:0 0 9px #a22b42;animation:scan 1.2s ease-in-out infinite alternate}.dot{position:absolute;width:7px;height:7px;background:#d69c16;border-radius:50%;animation:float 2s infinite alternate ease-in-out}.d1{left:25%;top:42%}.d2{left:58%;top:38%}.d3{left:72%;top:54%}.d4{left:38%;top:63%}.d5{left:64%;top:67%}@keyframes scan{from{top:38%}to{top:62%}}@keyframes float{from{transform:translateY(-10px)}to{transform:translateY(14px)}}
@media(max-width:430px){.coupon-card{margin-left:28px;margin-right:28px}.instruction{font-size:27px}.meal{font-size:22px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const KEY='messPassProfileV7';
let profile=null, selectedMeal='Lunch', selectedVideoUrl='';
const app=document.getElementById('app');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function getProfile(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function saveProfile(p){localStorage.setItem(KEY,JSON.stringify(p));profile=p}
function showForm(){
 app.innerHTML=`<div class="screen"><div class="header">Fill Profile</div><div class="form-wrap">
 <div class="notice">✓ Fill this once. Your profile is saved on this device and reused next time.</div>
 <div class="photo-preview"><img id="photoPreview" src="${profile?.photo||''}" onerror="this.style.display='none'"></div>
 <div class="field"><label>Profile Photo</label><input id="photo" type="file" accept="image/*"></div>
 ${field('name','Full Name',profile?.name||'Ayush M')}${field('id','ID Number',profile?.id||'12434322')}${field('mess','Mess Assigned',profile?.mess||'Mess BH-4')}${field('program','Program',profile?.program||'P132:B.Tech. (Computer Science and Engineering)(2022)')}${field('father',"Father's Name",profile?.father||'Mahesh KC (9483746197)')}${field('mother',"Mother's Name",profile?.mother||'Reetha')}${field('hostel','Hostel',profile?.hostel||'Boys Hostel-04-B511-Bed C Mess')}
 <div class="field"><label>Accepted Badge Video</label><input id="video" type="file" accept="video/mp4,video/webm,video/*"><div class="small">Upload the exact video you want displayed in the green section of the final Mess Pass.</div><div id="videoPreviewWrap"></div></div>
 <div class="field"><label>Pass Accent Color</label><input id="accent" type="color" value="${profile?.accent||'#062506'}"></div>
 <button class="save" id="save">💾 SAVE PROFILE</button></div></div>`;
 const photo=document.getElementById('photo'); photo.addEventListener('change',e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>{document.getElementById('photoPreview').src=r.result;document.getElementById('photoPreview').style.display='block'};r.readAsDataURL(f)}});
 if(profile?.video){renderVideoPreview(profile.video)}
 document.getElementById('video').addEventListener('change',e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>renderVideoPreview(r.result);r.readAsDataURL(f)}});
 document.getElementById('save').onclick=()=>{const p={name:v('name'),id:v('id'),mess:v('mess'),program:v('program'),father:v('father'),mother:v('mother'),hostel:v('hostel'),accent:document.getElementById('accent').value,photo:document.getElementById('photoPreview').src,video:document.getElementById('video').files[0]?null:(profile?.video||null)};const file=document.getElementById('video').files[0];if(file){const r=new FileReader();r.onload=()=>{p.video=r.result;saveProfile(p);showCoupon()};r.readAsDataURL(file)}else{saveProfile(p);showCoupon()}};
}
function renderVideoPreview(src){document.getElementById('videoPreviewWrap').innerHTML=`<div class="video-preview"><video src="${src}" controls muted></video></div>`}
function field(id,label,val){return `<div class="field"><label>${label}</label><input id="${id}" type="text" value="${esc(val)}"></div>`}
function v(id){return document.getElementById(id).value}
function showCoupon(){profile=getProfile();if(!profile){showForm();return}app.innerHTML=`<div class="coupon"><div class="header"><span class="back">‹</span>Mess Coupon<span class="x">×</span></div><div class="coupon-card" id="profilePhotoAccess"><div class="coupon-photo"><img src="${profile.photo}"></div><div class="nameid">${esc(profile.name)} ${esc(profile.id)}</div><div class="detail"><strong>Father's Name</strong>${esc(profile.father)}</div><div class="detail"><strong>Mother's Name</strong>${esc(profile.mother)}</div><div class="detail"><strong>Program Name</strong>${esc(profile.program)}</div><div class="detail"><strong>Hostel</strong>${esc(profile.hostel)}</div></div><div class="instruction">Tap on the meal name to scan<br>and avail food.</div><div class="rate">⭐ RATE US</div><div class="meal-grid"><button class="meal" data-meal="Breakfast">Breakfast <span>→</span></button><button class="meal" data-meal="Lunch">Lunch <span>→</span></button><button class="meal" data-meal="Dinner">Dinner <span>→</span></button></div></div>`;document.querySelectorAll('.meal').forEach(b=>b.onclick=()=>{selectedMeal=b.dataset.meal;showScanner()});document.getElementById('profilePhotoAccess').ondblclick=showForm}
function showScanner(){app.innerHTML=`<div class="scanner"><div class="scanner-camera"></div><div class="scan-line"></div><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="dot d4"></span><span class="dot d5"></span></div>`;setTimeout(showPass,4000)}
function makeQR(){const data=encodeURIComponent(`${profile.id}-${profile.name} - MESS PASS VERIFICATION SYSTEM ACCREDITED`);return `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${data}&ecc=H&margin=10`}
function showPass(){profile=getProfile();const now=new Date();const date=now.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'});const time=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});app.innerHTML=`<div class="pass"><div class="header">Mess Pass<span class="x">×</span></div><div class="pass-card"><div class="pass-top"><div class="badge">27</div><div class="pass-grid"><div><div class="frame"><img src="${profile.photo}"></div><div class="pass-text">${esc(profile.id)}</div><div class="pass-sub">${esc(profile.name)}</div></div><div><div class="frame qr-frame"><img src="${makeQR()}" alt="QR"></div><div class="pass-text">${selectedMeal}</div><div class="pass-sub">${esc(profile.mess)}</div></div></div></div><div class="info"><div style="margin-bottom:18px">${esc(profile.program)}</div><div style="font-weight:700">Your Assigned Mess - ${esc(profile.mess)}</div></div><div class="date-row"><span>${date}</span><span>${time}</span></div><div class="approved">Meal Approved</div><div class="rate-pass"><div class="rate">⭐ RATE US</div></div><div class="video-strip" style="--accent:${profile.accent}"><div class="video-box">${profile.video?`<video src="${profile.video}" autoplay loop muted playsinline></video>`:`<div class="video-empty">No accepted badge video uploaded.<br>Double-click the profile photo on the coupon page to add one.</div>`}</div></div><div class="footer"><div class="gray">Father's Name</div><div class="value">${esc(profile.father)}</div><div class="gray">Mother's Name</div><div class="value">${esc(profile.mother)}</div><div class="gray">Program</div><div class="value">${esc(profile.program)}</div><div class="gray">Hostel</div><div class="value">${esc(profile.hostel)}</div></div></div></div>`}
profile=getProfile();if(profile)showCoupon();else showForm();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body></html>
